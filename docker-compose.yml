services:
  redis:
    container_name: kratos-redis
    image: redis
    ports:
      - "16379:6379"
    volumes:
      - ./data/redis:/data
  mysql:
    container_name: kratos-mysql
    image: mysql
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: hxc
      MYSQL_DATABASE: kratos
    volumes:
      - ./data/mysql:/var/lib/mysql