tags:
    - name: Article
    - name: AuthService
      description: 简单账号体系（可选）：注册、登录、获取当前用户信息。
    - name: ContentService
      description: ContentService AI 内容加工坊 HTTP/gRPC 服务。
    - name: DispatchService
      description: DispatchService 多账号分发矩阵 HTTP/gRPC 服务。
    - name: GameService
      description: 游戏配置与对局管理相关接口。
    - name: InboxService
      description: InboxService 获客截流 HTTP/gRPC 服务。
    - name: ProductService
      description: ProductService 选品采集仓 HTTP/gRPC 服务。
    - name: Realworld
    - name: StatsService
      description: 战绩查询与排行榜接口。
    - name: TodoService
      description: Todo 服务定义，包含 4 个 RPC 方法，分别对应 4 个 RESTful API。
