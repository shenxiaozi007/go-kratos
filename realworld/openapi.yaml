            type: object
            properties:
                id:
                    type: string
                    description: 待办事项 ID。
            description: DeleteTodoRequest 用于根据 id 删除待办事项。
        todo.v1.GetTodoListReply:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/todo.v1.Todo'
            description: |-
                GetTodoListReply 是“查询所有待办事项”的返回值结构。
                 为了兼容 JSON 格式，这里返回一个对象，其中 items 字段为数组：
                 {
                   "items": [
                     { "id": 1, "value": "示例", "isCompleted": false },
                     ...
                   ]
                 }
        todo.v1.Todo:
            type: object
            properties:
                id:
                    type: string
                    description: 唯一标识，对应数据库中的主键 ID。
                value:
                    type: string
                    description: 待办事项的具体内容。
                isCompleted:
                    type: boolean
                    description: 是否完成。
            description: Todo 是待办事项的数据结构定义。
        todo.v1.TodoReply:
            type: object
            properties:
                todo:
                    $ref: '#/components/schemas/todo.v1.Todo'
            description: TodoReply 是返回单个待办事项的通用结构。
        todo.v1.UpdateTodoRequest:
            type: object
            properties:
                id:
                    type: string
                    description: 待办事项 ID。
            description: UpdateTodoRequest 用于根据 id 更新待办事项状态（取反）。
