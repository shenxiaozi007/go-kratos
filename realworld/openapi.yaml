                isCompleted:
                    type: boolean
                    description: 是否完成，默认为 false。
            description: AddTodoRequest 是“添加新的待办事项”的请求体结构。
        todo.v1.DeleteTodoReply:
            type: object
            properties:
                success:
                    type: boolean
                    description: 删除是否成功。
            description: DeleteTodoReply 表示删除操作的结果状态。
