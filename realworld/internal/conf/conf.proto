syntax = "proto3";
package kratos.api;

option go_package = "realworld/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  // Auth 用于 v2 鉴权：JWT 签发与校验（xsh 后台登录、/api/xsh/v1 路由保护）。
  message Auth {
    string jwt_secret = 1;         // JWT 签名密钥，必填则启用鉴权
    int32 jwt_expire_seconds = 2;  // 过期时间（秒），默认 86400
  }
  HTTP http = 1;
  GRPC grpc = 2;
  Auth auth = 3;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
    string username = 3;
    string password = 4;
    string host = 5;
    int32 port = 6;
    string database = 7;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
  }
  Database database = 1;
  Redis redis = 2;
}
