syntax = "proto3";

package stats.v1;

import "google/api/annotations.proto";

option go_package = "realworld/api/stats/v1;v1";

enum GameMode {
  GAME_MODE_UNKNOWN = 0;
  GAME_MODE_SINGLE = 1;
  GAME_MODE_LOCAL_PVP = 2;
}

// 单场对局记录。
message MatchRecord {
  string session_id = 1;
  int64 user_id = 2;
  GameMode mode = 3;
  int64 map_id = 4;
  bool is_win = 5;
  int32 player1_kills = 6;
  int32 player2_kills = 7;
  int32 enemy_kills = 8;
  int32 duration_seconds = 9;
  int64 created_at = 10; // unix timestamp
}

// 分页查询历史战绩。
message ListMatchesRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListMatchesReply {
  repeated MatchRecord records = 1;
  int32 page = 2;
  int32 page_size = 3;
  int64 total = 4;
}

// 排行榜条目。
message LeaderboardEntry {
  int64 user_id = 1;
  string username = 2;
  int32 total_matches = 3;
  int32 total_wins = 4;
  float win_rate = 5;
}

message GetLeaderboardRequest {
  int32 limit = 1;
}

message GetLeaderboardReply {
  repeated LeaderboardEntry entries = 1;
}

// 战绩查询与排行榜接口。
service StatsService {
  // 查询个人历史对局记录（基于当前登录用户）。
  //
  // HTTP:
  //   GET /api/v1/stats/matches?page=1&page_size=20
  rpc ListMatches(ListMatchesRequest) returns (ListMatchesReply) {
    option (google.api.http) = {
      get: "/api/v1/stats/matches";
    };
  }

  // 查询排行榜。
  //
  // HTTP:
  //   GET /api/v1/stats/leaderboard?limit=50
  rpc GetLeaderboard(GetLeaderboardRequest) returns (GetLeaderboardReply) {
    option (google.api.http) = {
      get: "/api/v1/stats/leaderboard";
    };
  }
}

